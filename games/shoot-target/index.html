<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🚀 Astro-Escape: Lluvia de Meteoritos</title>
    <style>
        body {
            margin: 0;
            background: #0b0b16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 1.4rem; text-align: center; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        p { margin: 0 0 10px 0; font-size: 0.85rem; color: #a0a0c0; text-align: center; }
        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,255,204,0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333355;
        }
        canvas {
            background: #111122;
            display: block;
        }
        .mobile-controls {
            display: flex;
            gap: 40px;
            margin-top: 10px;
        }
        .btn {
            background: #222244;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            font-size: 1.5rem;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active {
            background: #00ffcc;
            color: #111122;
        }
    </style>
</head>
<body>

    <h1>👨‍🚀 Astro-Escape: Lluvia de Meteoritos</h1>
    <p>PC: Flechas/WASD | Móvil: Botones/Táctil | Mando: Joystick/D-Pad + Botón A</p>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
    </div>

    <div class="mobile-controls">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn" id="rightBtn">▶</button>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Estado del juego
let score = 0;
let highScore = 0;
let lives = 3;
let isGameOver = false;
let gameStarted = false;

// Jugador (👨‍🚀)
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 60,
    width: 40,
    height: 40,
    speed: 6
};

// Elementos del juego
let rocks = [];
let powerUp = null;
let spawnTimer = 0;
let powerUpSpawnTimer = 0;
let shieldActive = false;
let shieldTimer = 0;

// Controles
const keys = {};
let mobileLeft = false;
let mobileRight = false;
let touchX = null;

// Event listeners Teclado
window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (!gameStarted && (e.code === "Space" || e.code === "ArrowUp")) {
        startGame();
    } else if (isGameOver && e.code === "Space") {
        resetGame();
    }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

// Botones táctiles en pantalla (Móvil)
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const bindTouchButton = (btn, onDown, onUp) => {
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); onDown(); if(!gameStarted) startGame(); else if(isGameOver) resetGame(); });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); onUp(); });
    btn.addEventListener("mousedown", (e) => { onDown(); if(!gameStarted) startGame(); else if(isGameOver) resetGame(); });
    btn.addEventListener("mouseup", (e) => { onUp(); });
};

bindTouchButton(leftBtn, () => mobileLeft = true, () => mobileLeft = false);
bindTouchButton(rightBtn, () => mobileRight = true, () => mobileRight = false);

// Táctil deslizante en el canvas
canvas.addEventListener("touchmove", (e) => {
    let rect = canvas.getBoundingClientRect();
    touchX = e.touches[0].clientX - rect.left;
    e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchstart", (e) => {
    if (!gameStarted) { startGame(); return; }
    if (isGameOver) { resetGame(); return; }
    let rect = canvas.getBoundingClientRect();
    touchX = e.touches[0].clientX - rect.left;
});

function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        loop();
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    rocks = [];
    powerUp = null;
    shieldActive = false;
    player.x = canvas.width / 2 - 20;
    isGameOver = false;
    gameStarted = true;
    loop();
}

function update() {
    if (isGameOver || !gameStarted) return;

    // 1. Teclado (PC)
    if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
    if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

    // 2. Botones virtuales móviles
    if (mobileLeft) player.x -= player.speed;
    if (mobileRight) player.x += player.speed;

    // 3. Táctil (Móvil arrastre directo)
    if (touchX !== null) {
        player.x = touchX - player.width / 2;
        touchX = null;
    }

    // 4. Gamepad (Mando)
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (gp) {
            let moveX = gp.axes[0];
            if (Math.abs(moveX) > 0.1) player.x += moveX * player.speed;
            if (gp.buttons[14].pressed) player.x -= player.speed; // D-pad Izquierda
            if (gp.buttons[15].pressed) player.x += player.speed; // D-pad Derecha
            
            if (isGameOver && gp.buttons[0].pressed) resetGame();
            if (!gameStarted && gp.buttons[0].pressed) startGame();
        }
    }

    // Límites de pantalla
    if (player.x < 10) player.x = 10;
    if (player.x > canvas.width - player.width - 10) player.x = canvas.width - player.width - 10;

    // Duración del escudo de poder (🌀)
    if (shieldActive) {
        shieldTimer--;
        if (shieldTimer <= 0) {
            shieldActive = false;
        }
    }

    // Generar Rocas (🪨)
    spawnTimer++;
    if (spawnTimer > 30) {
        let rockSize = 35;
        rocks.push({
            x: Math.random() * (canvas.width - rockSize - 20) + 10,
            y: -rockSize,
            width: rockSize,
            height: rockSize,
            speed: 3 + Math.random() * 3
        });
        spawnTimer = 0;
    }

    // Generar Power-Up (🌀) aleatorio
    powerUpSpawnTimer++;
    if (!powerUp && powerUpSpawnTimer > 350) {
        let puSize = 30;
        powerUp = {
            x: Math.random() * (canvas.width - puSize - 20) + 10,
            y: -puSize,
            width: puSize,
            height: puSize,
            speed: 2.5
        };
        powerUpSpawnTimer = 0;
    }

    // Actualizar Power-Up (🌀)
    if (powerUp) {
        powerUp.y += powerUp.speed;
        if (
            player.x < powerUp.x + powerUp.width &&
            player.x + player.width > powerUp.x &&
            player.y < powerUp.y + powerUp.height &&
            player.y + player.height > powerUp.y
        ) {
            shieldActive = true;
            shieldTimer = 300; // ~5 segundos de invulnerabilidad explosiva
            powerUp = null;
        } else if (powerUp.y > canvas.height) {
            powerUp = null;
        }
    }

    // Actualizar Rocas y Colisiones
    for (let i = rocks.length - 1; i >= 0; i--) {
        rocks[i].y += rocks[i].speed;

        // Colisión Roca vs Jugador
        if (
            player.x < rocks[i].x + rocks[i].width &&
            player.x + player.width > rocks[i].x &&
            player.y < rocks[i].y + rocks[i].height &&
            player.y + player.height > rocks[i].y
        ) {
            if (shieldActive) {
                // Si el escudo 🌀 está activo, la roca explota sin daño
                rocks.splice(i, 1);
                score += 50;
                continue;
            } else {
                // Pierde vida
                lives--;
                rocks.splice(i, 1);
                if (lives <= 0) {
                    isGameOver = true;
                    if (score > highScore) highScore = score;
                }
                continue;
            }
        }

        // Si la roca pasa de largo, suma puntos
        if (rocks[i] && rocks[i].y > canvas.height) {
            rocks.splice(i, 1);
            score += 10;
        }
    }
}

function draw() {
    ctx.fillStyle = "#111122";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Fondo de estrellas
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(40, 60, 2, 2);
    ctx.fillRect(120, 180, 2, 2);
    ctx.fillRect(280, 90, 2, 2);
    ctx.fillRect(340, 320, 2, 2);
    ctx.fillRect(90, 380, 2, 2);

    // Dibujar Escudo de Poder (si está activo)
    if (shieldActive) {
        ctx.beginPath();
        ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 32, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 255, 204, 0.25)";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#00ffcc";
        ctx.stroke();
    }

    // Dibujar Jugador 👨‍🚀
    ctx.font = "34px sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("👨‍🚀", player.x, player.y);

    // Dibujar Power-Up 🌀
    if (powerUp) {
        ctx.fillText("🌀", powerUp.x - 2, powerUp.y - 2);
    }

    // Dibujar Rocas 🪨
    for (let r of rocks) {
        ctx.fillText("🪨", r.x - 2, r.y - 2);
    }

    // Puntuación y Vidas (❤️❤️❤️)
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText("PUNTOS: " + score, 15, 15);
    
    let heartsText = "❤️".repeat(lives);
    ctx.fillText("VIDAS: " + heartsText, 15, 40);
    ctx.fillText("RÉCORD: " + highScore, canvas.width - 130, 15);

    // Indicador de escudo activo
    if (shieldActive) {
        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("¡ESCUDO ACTIVO! (" + Math.ceil(shieldTimer/60) + "s)", canvas.width / 2 - 75, 45);
    }

    // Pantalla de Inicio
    if (!gameStarted) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 22px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("👨‍🚀 ASTRO-ESCAPE 🪨", canvas.width / 2, canvas.height / 2 - 50);

        ctx.fillStyle = "#fff";
        ctx.font = "14px sans-serif";
        ctx.fillText("Esquiva las rocas y recolecta 🌀", canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillText("Pulsa Espacio, Toca o Botón A", canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText("para Comenzar", canvas.width / 2, canvas.height / 2 + 45);
        ctx.textAlign = "left";
    }

    // Pantalla de Game Over
    if (isGameOver) {
        ctx.fillStyle = "rgba(10, 10, 20, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff3366";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("Puntuación final: " + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Pulsa Espacio para reintentar", canvas.width / 2, canvas.height / 2 + 40);
        ctx.textAlign = "left";
    }
}

function loop() {
    update();
    draw();
    if (!isGameOver && gameStarted) {
        requestAnimationFrame(loop);
    }
}

draw();
</script>

</body>
</html>

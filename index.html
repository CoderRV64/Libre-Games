<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    
    <!-- Favicons blindados para PC, Android e iOS -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="shortcut icon" href="images/icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <title>Libre Games</title>
    <style>
        /* Paleta de colores: Negro Profundo y Azul Eléctrico */
        :root { 
            --bg: #090d16; 
            --card: #151f32; 
            --accent: #3b82f6; 
            --accent-hover: #1d4ed8;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; 
        }

        header { 
            padding: 15px 25px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--card); 
            background: var(--bg); position: sticky; top: 0; z-index: 10;
        }
        h1 { margin: 0; color: white; text-transform: uppercase; letter-spacing: 2px; border-left: 4px solid var(--accent); padding-left: 10px; font-size: 1.2rem; }

        #btn-instalar { 
            display: none; background: var(--accent); border: none; padding: 6px 12px; 
            border-radius: 6px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem;
            transition: background 0.2s;
        }
        #btn-instalar:hover { background: var(--accent-hover); }

        /* Contenedor en Cuadrícula (Grid) universal */
        .catalog-container { 
            flex-grow: 1; padding: 25px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px;
            max-width: 1400px; margin: 0 auto; width: 100%;
        }

        .game-card { 
            background: var(--card);
            border-radius: 12px; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
            min-height: 180px;
            border: 2px solid transparent;
            transition: all 0.2s ease-in-out;
        }

        .game-card:hover, .game-card:focus { 
            border-color: var(--accent); 
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            outline: none;
        }

        .game-card h2 { 
            margin: 0 0 15px 0; font-size: 1.1rem; 
            text-align: center; word-break: break-word; 
        }

        .action-btn { 
            background: var(--accent); border: none; padding: 12px; 
            border-radius: 6px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; color: white; transition: background 0.2s, color 0.2s;
            width: 100%; font-size: 0.85rem;
        }

        .action-btn:hover { background: white; color: var(--bg); }

        /* Ajustes finos para móviles */
        @media (max-width: 600px) {
            .catalog-container { padding: 15px; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .game-card { padding: 15px; min-height: 150px; }
            .game-card h2 { font-size: 0.95rem; }
            .action-btn { padding: 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Libre Games</h1>
        <button id="btn-instalar">Instalar Consola</button>
    </header>

    <div class="catalog-container" id="game-slider"></div>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btnInstalar = document.getElementById('btn-instalar');
            btnInstalar.style.display = 'block';
            btnInstalar.addEventListener('click', async () => {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalar.style.display = 'none';
                }
                deferredPrompt = null;
            });
        });

        async function cargarTienda() {
            try {
                let textoYaml = "";
                try {
                    const respuesta = await fetch('games.yaml?v=' + new Date().getTime());
                    if (!respuesta.ok) throw new Error("Red no disponible");
                    textoYaml = await respuesta.text();
                } catch (netError) {
                    const cacheMatch = await caches.match('games.yaml');
                    if (cacheMatch) {
                        textoYaml = await cacheMatch.text();
                    } else {
                        throw new Error("No hay datos en caché para los juegos.");
                    }
                }

                const juegos = jsyaml.load(textoYaml);
                const slider = document.getElementById('game-slider');
                slider.innerHTML = '';

                for (const juego of juegos) {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.tabIndex = 0; 
                    
                    const cacheName = 'juego-' + juego.id;
                    const cacheExists = await caches.has(cacheName);

                    card.innerHTML = `
                        <h2>${juego.titulo}</h2>
                        <button class="action-btn" onclick="gestionarJuego('${juego.id}', '${juego.ruta}', event)">
                            ${cacheExists ? 'JUGAR' : 'DESCARGAR'}
                        </button>
                    `;
                    slider.appendChild(card);
                }
            } catch (error) {
                console.error("Error al cargar la tienda offline:", error);
            }
        }

        async function gestionarJuego(id, ruta, event) {
            event.stopPropagation();
            const btn = event.target;
            const cacheName = 'juego-' + id;
            if (btn.innerText === 'DESCARGAR') {
                try {
                    btn.innerText = 'DESCARGANDO...';
                    const cache = await caches.open(cacheName);
                    await cache.add(ruta);
                    btn.innerText = 'JUGAR';
                } catch (error) {
                    console.error("Error en la descarga:", error);
                    btn.innerText = 'DESCARGAR';
                    alert('No se pudo descargar. Comprueba tu conexión a internet.');
                }
            } else {
                window.location.href = ruta;
            }
        }

        cargarTienda();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Ruta relativa fija sin la barra diagonal inicial
          navigator.serviceWorker.register('sw.js')
            .then((registration) => {
              console.log('Service Worker registrado correctamente con alcance:', registration.scope);
            })
            .catch((error) => {
              console.log('Error al registrar el Service Worker:', error);
            });
        });
      }
    </script>
</body>
</html>

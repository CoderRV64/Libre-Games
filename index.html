<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#76FF03">
    <!-- Favicon absoluto seguro -->
    <link rel="icon" type="image/png" href="https://libre-games.netlify.app/images/icon-192.png">

    <!-- Icono específico para dispositivos Apple (iOS) -->
    <link rel="apple-touch-icon" href="https://libre-games.netlify.app/images/icon-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <title>Libre Games</title>
    <style>
        :root { --bg: #0b0e14; --card: #1a1f29; --accent: #22c55e; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            padding: 8px 15px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #1a1f29; flex-shrink: 0;
        }
        h1 { margin: 0; color: white; text-transform: uppercase; letter-spacing: 2px; border-left: 4px solid var(--accent); padding-left: 8px; font-size: 1rem; }

        #btn-instalar { 
            display: none; background: var(--accent); border: none; padding: 5px 10px; 
            border-radius: 6px; font-weight: bold; cursor: pointer; color: #0b0e14; text-transform: uppercase; font-size: 0.7rem;
        }
        #btn-instalar:hover { background: #16a34a; color: white; }

        .slider-container { 
            flex-grow: 1; display: flex; align-items: center; 
            overflow-x: auto; overflow-y: hidden; padding: 15px; gap: 15px;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .game-card { 
            flex: 0 0 auto;
            width: 240px; height: 220px; background: var(--card);
            border-radius: 12px; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
            scroll-snap-align: center; border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .game-card:hover { 
            border-color: var(--accent); transform: scale(1.02);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
        }

        .game-card h2 { margin: 0; font-size: 1.1rem; text-align: center; word-break: break-word; }

        .action-btn { 
            background: var(--accent); border: none; padding: 12px; 
            border-radius: 6px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; color: var(--bg); transition: background 0.2s;
            width: 100%; font-size: 0.85rem;
        }

        .action-btn:hover { background: #fff; }

        /* Corrección adaptativa agresiva para cuando las barras del navegador restan altura (Landscape < 420px) */
        @media (max-height: 420px) and (orientation: landscape) {
            body { overflow-y: auto; }
            header { padding: 4px 12px; }
            h1 { font-size: 0.85rem; letter-spacing: 1px; border-left-width: 3px; }
            #btn-instalar { padding: 4px 8px; font-size: 0.65rem; }
            .slider-container { 
                padding: 10px; gap: 10px; 
                align-items: center;
            }
            .game-card { 
                width: 240px; height: 85px; 
                flex-direction: row; align-items: center; 
                justify-content: space-between; padding: 10px 12px;
            }
            .game-card h2 { font-size: 0.85rem; text-align: left; margin: 0; flex-grow: 1; padding-right: 8px; }
            .action-btn { width: 95px; padding: 6px; font-size: 0.7rem; flex-shrink: 0; }
        }

        /* Ajustes para móviles en modo VERTICAL (Portrait) */
        @media (max-width: 600px) and (orientation: portrait) {
            .slider-container { padding: 15px; gap: 15px; }
            .game-card { width: 200px; height: 200px; padding: 15px; }
            .game-card h2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Libre Games</h1>
        <button id="btn-instalar">Instalar Consola</button>
    </header>

    <div class="slider-container" id="game-slider"></div>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btnInstalar = document.getElementById('btn-instalar');
            btnInstalar.style.display = 'block';
            btnInstalar.addEventListener('click', async () => {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalar.style.display = 'none';
                }
                deferredPrompt = null;
            });
        });

        async function cargarTienda() {
            try {
                let textoYaml = "";
                try {
                    const respuesta = await fetch('https://libre-games.netlify.app/games.yaml?v=' + new Date().getTime());
                    if (!respuesta.ok) throw new Error("Red no disponible");
                    textoYaml = await respuesta.text();
                } catch (netError) {
                    const cacheMatch = await caches.match('games.yaml');
                    if (cacheMatch) {
                        textoYaml = await cacheMatch.text();
                    } else {
                        throw new Error("No hay datos en caché para los juegos.");
                    }
                }

                const juegos = jsyaml.load(textoYaml);
                const slider = document.getElementById('game-slider');
                slider.innerHTML = '';

                for (const juego of juegos) {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    
                    const cacheName = 'juego-' + juego.id;
                    const cacheExists = await caches.has(cacheName);

                    card.innerHTML = `
                        <h2>${juego.titulo}</h2>
                        <button class="action-btn" onclick="gestionarJuego('${juego.id}', '${juego.ruta}', this)">
                            ${cacheExists ? 'JUGAR' : 'DESCARGAR'}
                        </button>
                    `;
                    slider.appendChild(card);
                }
            } catch (error) {
                console.error("Error al cargar la tienda offline:", error);
            }
        }

        async function gestionarJuego(id, ruta, btn) {
            const cacheName = 'juego-' + id;
            if (btn.innerText === 'DESCARGAR') {
                try {
                    btn.innerText = 'DESCARGANDO...';
                    const cache = await caches.open(cacheName);
                    await cache.add(ruta);
                    btn.innerText = 'JUGAR';
                } catch (error) {
                    console.error("Error en la descarga:", error);
                    btn.innerText = 'DESCARGAR';
                    alert('No se pudo descargar. Comprueba tu conexión a internet.');
                }
            } else {
                window.location.href = ruta;
            }
        }

        cargarTienda();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado correctamente con alcance:', registration.scope);
            })
            .catch((error) => {
              console.log('Error al registrar el Service Worker:', error);
            });
        });
      }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Penalty Round 26</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA DE SELECCIÓN -->
  <div id="pantalla-seleccion">
    <h1>Penalty Round 26</h1>
    <p>Elige tu país:</p>
    <div id="lista-tu-pais" class="grid-paises"></div>
    <p>Elige tu rival:</p>
    <div id="lista-rival" class="grid-paises"></div>
    <button id="btn-jugar" disabled>¡JUGAR!</button>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="pantalla-juego" class="oculto">
    <!-- Marcador -->
    <div id="marcador">
      <div id="txt-score">Score 🇪🇸: 0</div>
      <div id="txt-detenidos">Detenidos 🇫🇷: 0</div>
      <div id="txt-highscore">Récord: 0</div>
    </div>

    <!-- Campo de fútbol CSS -->
    <div id="campo">
      <div id="porteria"></div>
      <div id="portero">👨‍🦱</div>
      <div id="balon">⚽</div>
    </div>

    <!-- Texto de Gol Animado -->
    <div id="cartel-gol" class="oculto-anim"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
